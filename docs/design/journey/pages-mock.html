<!doctype html>
<html><head><meta charset="utf-8"><title>pages mock</title>
<style>
:root{--ink:#1d2330;--mute:#677086;--line:#e2e5ec;--bg:#f4f5f8;--acc:#3557D4;--soft:#e8edfc;--ok:#1f8a4c;--warn:#a66300;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:13px;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);width:1440px;height:820px;display:flex;flex-direction:column}
.title{height:46px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#f0f1f5;border-bottom:1px solid var(--line)}
.brand{font-weight:600}.grow{flex:1}
.pages{display:flex;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.pg{padding:5px 14px;border-radius:6px;color:#444;display:flex;gap:6px;align-items:center}
.pg.on{background:var(--acc);color:#fff;font-weight:600}
.pg .n{font-size:10px;opacity:.7}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 11px}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.tools{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line)}
.tool{padding:4px 10px;border-radius:6px;border:1px solid transparent;display:flex;gap:6px;align-items:center}
.tool i{width:14px;height:14px;border-radius:3px;background:var(--soft);border:1px solid #c9d3f6;display:inline-block}
.tool.b{border-color:var(--line)}.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.main{flex:1;display:flex;min-height:0}
.left{width:250px;background:#fff;border-right:1px solid var(--line);padding:12px;overflow:hidden}
.right{width:300px;background:#fff;border-left:1px solid var(--line);padding:14px;overflow:hidden}
.canvas{flex:1;display:grid;place-items:center;background:radial-gradient(#d9dce4 1px,transparent 1px) 0 0/14px 14px;position:relative}
.h{font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin:8px 0 6px}
.row{padding:5px 8px;border-radius:5px;display:flex;justify-content:space-between;gap:8px}.row.sel{background:var(--soft);color:var(--acc)}
.row small{color:#9aa1b2}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}.f div{border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.ro{color:var(--mute);font-size:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.ro a{color:var(--acc)}
.table{width:620px;height:372px;background:#1a2133;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tv{width:760px;height:428px;background:#141824;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;padding:10px;gap:10px}
.rail{width:56px;display:flex;flex-direction:column;gap:8px}.rail span{height:38px;border-radius:6px;background:#2a3146}.rail span.sel{outline:2px solid #f3ad3d}
.stage{flex:1;background:#1d2335;border-radius:6px}
.placemap{position:absolute;inset:16px;border-radius:8px;background:repeating-linear-gradient(35deg,#e9ecf2 0 18px,#f6f7fa 18px 36px);border:1px solid var(--line)}
.outline{position:absolute;left:38%;top:28%;width:26%;height:30%;border:2px dashed #d98a00;background:rgba(243,173,61,.12)}
.grid{display:grid;grid-template-columns:repeat(4,170px);gap:12px;align-self:start;margin-top:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.card .th{height:96px;background:#1a2133}.card div{padding:8px}.card small{display:block;color:var(--mute)}
.steps{display:flex;gap:14px;align-self:start;margin-top:30px}
.step{width:250px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.step h4{margin:0 0 6px;font-size:14px}.ok{color:var(--ok)}.wn{color:var(--warn)}
.cap{position:absolute;bottom:12px;left:16px;color:var(--mute);font-size:12px}
</style></head><body>
<div id="root" style="display:flex;flex-direction:column;height:820px;width:1440px"></div>
<script>
const P = location.hash.slice(1) || 'map';
const pages = [['place','Place'],['data','Data'],['map','Map'],['controller','Controller'],['phones','Phones'],['present','Present']];
const T = (t,b) => `<span class="tool ${b?'b':''}"><i></i>${t}</span>`;
const v = {
place: {
 tools: T('Move the table',1)+T('Put back')+'<span class="sep"></span>'+T('Find a place'),
 left: null,
 canvas: `<div class="placemap"></div><div class="outline"></div><div class="cap">The whole window is the place: drag the outline, its corner turns or resizes it.</div>`,
 right: `<b>Place</b><div class="h">This table</div><div class="f"><label>Name</label><div>Sample district</div></div><div class="f"><label>Centre</label><div>57.70000, 11.97000</div></div><div class="f"><label>Table size, cm</label><div>100 × 60 at 1:1000</div></div><div class="f"><label>Turned</label><div>0°</div></div><div class="f"><label>Time zone</label><div>Europe/Stockholm</div></div>`},
data: {
 tools: T('Add files',1)+T('Fetch open data')+'<span class="sep"></span>'+T('Everything')+T('Map data')+T('Pictures')+T('Video')+T('Sounds'),
 left: `<div class="h">Your place</div><div class="row sel">Buildings <small>✓</small></div><div class="row">Ground <small>✓</small></div><div class="row">Streets <small>✓</small></div><div class="row">Trees <small>✓</small></div><div class="row">3D model <small>not yet</small></div><div class="h">Other files</div><div class="row">trip_cells</div><div class="row">transit</div>`,
 canvas: `<div class="grid">${['buildings','roads','trees','walkways','transit','trip_cells','old-photo.jpg','flyover.mp4'].map(n=>`<div class="card"><div class="th"></div><div>${n}<small>used by 2 layers</small></div></div>`).join('')}</div>`,
 right: `<b>Buildings</b><div class="h">File</div>buildings.geojson · 38 KB<br>412 footprints, height from <i>height</i><div class="h">Used by</div>Sunlight · Wind · Base map<div class="ro">Colour it on the map: <a>Map › Base map</a></div>`},
map: {
 tools: T('Add a layer ▾',1)+T('Custom layer')+'<span class="sep"></span>'+T('Hide')+T('Duplicate')+T('Remove')+'<span class="sep"></span>'+T('Rehearse'),
 left: `<div class="h">At rest</div><div class="row">Base map <small>dark</small></div><div class="row">Building lights</div><div class="row">Traffic</div><div class="row">Trees</div><div class="h">Layers</div><div class="row sel">Wind</div><div class="row">Mobility</div><div class="row">Isovist</div><div class="row">Cool paths</div><div class="row">Sunlight</div>`,
 canvas: `<div class="table"></div><div class="cap">Only the table. No controller here.</div>`,
 right: `<b>Wind</b> <span style="color:#677086">what it shows</span><div class="h">Settings</div><div class="f"><label>Wind speed</label><div>5.0 m/s</div></div><div class="f"><label>From</label><div>270°</div></div><div class="f"><label>Show</label><div>Ribbons</div></div><div class="ro">Button: <b>Wind</b>, left side · <a>Edit on Controller</a></div>`},
controller: {
 tools: T('Theme ▾',1)+T('Icons / Icons and names')+'<span class="sep"></span>'+T('Add a group')+T('Welcome screen')+'<span class="sep"></span>'+T('Rehearse'),
 left: `<div class="h">Welcome</div><div class="row">Title and welcome line</div><div class="h">Left side</div><div class="row sel">Wind</div><div class="row">Mobility</div><div class="row">Isovist</div><div class="row">Cool paths</div><div class="h">Right side</div><div class="row">Sketch</div><div class="row">Slideshow</div><div class="row">Sunlight</div>`,
 canvas: `<div class="tv"><div class="rail"><span class="sel"></span><span></span><span></span><span></span></div><div class="stage"></div><div class="rail"><span></span><span></span><span></span></div></div><div class="cap">Only the controller. Drag buttons between the sides.</div>`,
 right: `<b>Wind button</b><div class="f"><label>Name</label><div>Wind</div></div><div class="f"><label>Description</label><div>How the wind moves between buildings…</div></div><div class="f"><label>Icon · Group</label><div>≋ · none</div></div><div class="f"><label>Controls shown</label><div>Speed, direction, show</div></div><div class="ro">What the layer draws: <a>Edit on Map</a></div>`},
phones: {
 tools: T('Phones can switch layers',1)+T('Languages'),
 left: `<div class="h">What phones get</div><div class="row sel">Join screen</div><div class="row">Layer list</div><div class="row">Guide's phone</div>`,
 canvas: `<div style="width:220px;height:440px;background:#141824;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.25)"></div>`,
 right: `<b>Join screen</b><div class="f"><label>Code</label><div>4437</div></div>`},
present: {
 tools: T('Rehearse',1)+T('Present',1)+T('Share by email',1)+'<span class="sep"></span>'+T('Screens and calibration'),
 left: null,
 canvas: `<div class="steps"><div class="step"><h4>1 · Check</h4><span class="ok">✓ 7 layers have their data</span><br><span class="wn">! Sunlight: no Swedish words</span> <a style="color:#3557D4">Fix</a><br><span class="wn">! Phones cannot join</span> <a style="color:#3557D4">Fix</a></div><div class="step"><h4>2 · Rehearse</h4>Click through as a visitor, here on this screen.</div><div class="step"><h4>3 · Present</h4>Map on the projector, controller on the 46" TV.</div><div class="step"><h4>4 · Share</h4>Pack the table and email it to the studio PC.</div></div>`,
 right: null}
}[P];
document.getElementById('root').innerHTML = `
<div class="title"><span class="brand">◆ MR Studio</span><span>File</span><span style="color:#aaa">↶ ↷</span><span class="grow"></span>
<div class="pages">${pages.map(([id,l],i)=>`<span class="pg ${id===P?'on':''}"><span class="n">${i+1}</span>${l}</span>`).join('')}</div>
<span class="grow"></span><span class="btn">?</span><span class="btn">Share</span><span class="btn p">Present</span></div>
<div class="tools">${v.tools}</div>
<div class="main">${v.left?`<div class="left">${v.left}</div>`:''}<div class="canvas">${v.canvas}</div>${v.right?`<div class="right">${v.right}</div>`:''}</div>`;
</script></body></html>
