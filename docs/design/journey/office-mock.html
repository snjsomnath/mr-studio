<!doctype html>
<html><head><meta charset="utf-8"><title>office mock</title>
<style>
:root{--ink:#1d2330;--mute:#677086;--line:#e2e5ec;--bg:#f4f5f8;--acc:#3557D4;--soft:#e8edfc;--ok:#1f8a4c;--warn:#a66300;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:13px;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}
#root{width:1440px;height:820px;display:flex;flex-direction:column;position:relative}
.title{height:44px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#f0f1f5}
.grow{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 11px}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:2px;padding:0 12px;background:#f0f1f5}
.tab{padding:7px 14px;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none}
.tab.on{background:#fff;border-color:var(--line);font-weight:600;margin-bottom:-1px}
.ctx{color:#7a4bd0}.ctx.on{color:#7a4bd0}
.ribbon{display:flex;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 12px 4px;height:96px}
.g{display:flex;flex-direction:column;padding:0 12px;border-right:1px solid var(--line)}.g.end{margin-left:auto;border-right:none}
.gt{display:flex;gap:4px;flex:1;align-items:flex-start}.gl{font-size:11px;color:var(--mute);text-align:center}
.big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 8px;min-width:62px;text-align:center;line-height:1.15}
.big i{width:22px;height:22px;border-radius:5px;background:var(--soft);border:1px solid #c9d3f6}
.col{display:flex;flex-direction:column;gap:3px}.sm{padding:2px 6px;display:flex;gap:6px;align-items:center}
.sm i{width:13px;height:13px;border-radius:3px;background:var(--soft);border:1px solid #c9d3f6}
.themes{display:flex;gap:6px}.th{width:62px;height:40px;border-radius:5px;background:#1a2133;border:2px solid transparent}.th.on{border-color:var(--acc)}
.main{flex:1;display:flex;min-height:0}
.left{width:250px;background:#fff;border-right:1px solid var(--line);padding:12px}
.h{font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin:8px 0 6px}
.row{padding:5px 8px;border-radius:5px;display:flex;justify-content:space-between}.row.sel{background:var(--soft);color:var(--acc)}.row small{color:#9aa1b2}
.canvas{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(#d9dce4 1px,transparent 1px) 0 0/14px 14px}
.map{width:460px;height:276px;background:#1a2133;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tv{width:460px;height:258px;background:#141824;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.right{width:300px;background:#fff;border-left:1px solid var(--line);padding:14px}
.f{margin-bottom:9px}.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}.f div{border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.scrim{position:absolute;inset:0;background:rgba(20,25,40,.28);display:grid;place-items:center}
.dlg{width:760px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;overflow:hidden}
.dlg .form{width:300px;padding:18px}.dlg .pm{flex:1;background:repeating-linear-gradient(35deg,#e9ecf2 0 18px,#f6f7fa 18px 36px);position:relative;min-height:360px}
.dlg .ol{position:absolute;left:30%;top:30%;width:40%;height:34%;border:2px dashed #d98a00;background:rgba(243,173,61,.12)}
.dlg h3{margin:0 0 12px}.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.status{height:26px;background:#f0f1f5;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;color:var(--mute)}
.wn{color:var(--warn)}
</style></head><body><div id="root"></div>
<script>
const M = location.hash.slice(1) || 'home';
const tabs = ['Home','Insert','Design','Present','View','Help'];
const on = {home:'Home',insert:'Insert',design:'Design',dialog:'Design',present:'Present'}[M];
const L=(t)=>`<div class="big"><i></i>${t}</div>`, S=(t)=>`<div class="sm"><i></i>${t}</div>`;
const G=(l,x,c='')=>`<div class="g ${c}"><div class="gt">${x}</div><div class="gl">${l}</div></div>`;
const R = {
 Home: G('Layer',L('New layer ▾')+`<div class="col">${S('Duplicate')}${S('Remove')}</div>`)+G('Selection',`<div class="col">${S('Hide')}${S('Move up')}${S('Move down')}</div><div class="col">${S('Move to right side')}${S('Rename')}</div>`)+G('Editing',`<div class="col">${S('Find a command (⌘K)')}${S('Reset settings')}</div>`),
 Insert: G('Layers',L('Layer gallery ▾')+L('Custom layer'))+G('Your data',L('Data file')+L('Open data'))+G('Media',L('Picture')+L('Video')+L('Sound')+L('3D model')),
 Design: G('Controller theme',`<div class="themes">${[1,2,3,4,5].map((_,i)=>`<div class="th ${i?'':'on'}"></div>`).join('')}</div>`)+G('Buttons',`<div class="col">${S('Icons')}${S('Icons and names')}</div>`)+G('Map',L('Base map ▾')+L('Palette'))+G('Table',L('Table size and place…')+L('Welcome and languages…')),
 Present: G('Check',L('Ready to present?'))+G('Start',L('Rehearse')+L('Present'))+G('Set up',L('Screens and calibration…')+`<div class="col">${S('Quality: Good')}${S('Phones can join')}</div>`)+G('Send',L('Share by email')+L('Export file'))
};
const sel = M==='home'||M==='insert'?'wind':'rest';
const left = `<div class="h">Map</div><div class="row ${sel==='rest'?'sel':''}">At rest<small>5 things</small></div><div class="h">Layers</div>${['Wind','Mobility','Isovist','Cool paths','Sketch','Slideshow','Sunlight'].map((n,i)=>`<div class="row ${sel==='wind'&&i===0?'sel':''}">${n}<small>${i<4?'Left':'Right'}</small></div>`).join('')}<div class="h">Around the table</div><div class="row">Controller</div><div class="row">Phones</div>`;
const right = sel==='wind' ? `<b>Wind</b><div class="h">Button</div><div class="f"><label>Name</label><div>Wind</div></div><div class="f"><label>Side</label><div>Left</div></div><div class="h">Settings</div><div class="f"><label>Wind speed</label><div>5.0 m/s</div></div><div class="f"><label>From</label><div>270°</div></div>` : `<b>At rest</b><div class="h">On the map</div><div class="f"><label>Base map</label><div>Dark, from your data</div></div><div class="f"><label>Traffic</label><div>On</div></div><div class="f"><label>Trees</label><div>On</div></div>`;
let html = `<div class="title"><b>◆ MR Studio</b><span>File</span><span style="color:#aaa">↶ ↷</span><span class="grow"></span><b>Sample district</b><span class="grow"></span><span class="btn">Share</span><span class="btn p">Present</span></div>
<div class="tabs">${tabs.map(t=>`<div class="tab ${t===on?'on':''}">${t}</div>`).join('')}</div>
<div class="ribbon">${R[on]||''}</div>
<div class="main"><div class="left">${left}</div><div class="canvas"><div class="map"></div><div class="tv"></div></div><div class="right">${right}</div></div>
<div class="status"><span>Saved</span><span class="grow"></span><span class="wn">2 things to check before presenting</span><span>1000 × 600 m</span></div>`;
if (M==='dialog') html += `<div class="scrim"><div class="dlg"><div class="form"><h3>Table size and place</h3><div class="f"><label>Name</label><div>Sample district</div></div><div class="f"><label>Centre</label><div>57.70000, 11.97000</div></div><div class="f"><label>Table, cm</label><div>100 × 60 at 1 : 1000</div></div><div class="f"><label>Turned</label><div>0°</div></div><div class="foot"><span class="btn">Cancel</span><span class="btn p">Move the table</span></div></div><div class="pm"><div class="ol"></div></div></div></div>`;
document.getElementById('root').innerHTML = html;
</script></body></html>
