<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>MR Studio</title>
    <style>
      :root {
        --bg: #0d0f12;
        --fg: #eef1f4;
        --muted: #9aa3ad;
        --accent: #6fd3a8;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        border: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
      }
      #app[hidden] {
        display: none;
      }
      .door {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .door[hidden] {
        display: none;
      }
      .door h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      .door p {
        margin: 0 auto;
        max-width: 22em;
        color: var(--muted);
      }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 3px solid #2a3038;
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      .door.stuck .spinner {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .door button {
        margin-top: 20px;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #06140e;
        font: inherit;
        font-weight: 600;
      }
      .door button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="door" id="door">
      <div>
        <div class="spinner"></div>
        <h1 id="door-title"></h1>
        <p id="door-text"></p>
        <button id="door-again" hidden></button>
      </div>
    </div>
    <iframe id="app" hidden allow="fullscreen; camera; microphone; geolocation; accelerometer; gyroscope" title="MR Studio"></iframe>
    <script type="module" src="./src/loader.ts"></script>
  </body>
</html>
