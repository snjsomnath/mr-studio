[package]
name = "mrs-host"
description = "MR Studio local host: serves surfaces, runs the session hub, fronts the compute engine"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
mrs-engine.workspace = true
mrs-site.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
mrs-relay.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
png = "0.18"

[lints]
workspace = true
