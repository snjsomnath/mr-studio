[package]
name = "mrs-site"
description = "MR Studio site package format: site.json, validation, scene baking"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
mrs-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
png = "0.18"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
quick-xml = "0.42"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.11"
rusqlite = { version = "0.43", features = ["bundled"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
