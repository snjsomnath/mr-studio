name: CI

# Runs on every pull request, and is called by the "Desktop app" workflow for every push to main
# and every version tag (.github/workflows/desktop.yml): a version is made and published only
# after these checks pass on that commit (#505).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push to a pull request replaces the run before it. A run on main or a tag has a group
# of its own and is never cancelled or replaced by this workflow: the Desktop app workflow that
# calls it decides the order of releases.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notes:
    name: Release note and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every pull request adds a note to changes/; merging it makes the next version (docs/RELEASING.md).
      - name: Release note
        if: github.event_name == 'pull_request'
        run: node scripts/release.mjs check "origin/${{ github.base_ref }}"
      - name: Release notes are readable
        run: node scripts/release.mjs pending
      # Every layer, kernel and site setting is covered by the docs and the MCP server.
      - name: Docs and MCP server know what is built
        run: node scripts/check-docs.mjs

  rust:
    name: Engine, site, host and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan driver, so the GPU kernels and the GPU/CPU parity tests run without a GPU.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo test

  rust-lint:
    name: Rust format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A fixed version, so a new Rust release's new lints never turn an unrelated pull request red.
      # Raise it on purpose, fixing what the new clippy finds in the same pull request.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The engine, site, host, CLI and relay. The desktop shell needs a webview to build and is linted where it is built.
      - run: cargo clippy --all-targets -- -D warnings

  web:
    name: SDK, runtime and layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: The layer template type-checks on its own, with the SDK types the app ships (#508)
        run: pnpm --filter @mrstudio/sdk types:check
      # Promises nobody awaits or catches (#264): how errors went missing before #259 and #260.
      - run: pnpm lint
      # Every package with tests, including the density budget: every panel and theme in the repo is checked against the dashboard rules.
      - run: pnpm -r test
      - run: pnpm build

  mcp:
    name: MCP server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mrstudio/mcp typecheck
      - run: pnpm --filter @mrstudio/mcp test
      # The Claude Desktop extension and the MCP Registry entry (checks the extension manifest).
      - run: pnpm --filter @mrstudio/mcp exec node scripts/pack.mjs

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: cargo build -p mrs-cli
      # The host, engine, every surface, the core layers, the editor and a phone (#261).
      - run: node scripts/e2e.cjs e2e-screenshots
      # The editor's flows (#67, #426): navigation, the list, the Format pane, dialogs, the tour.
      - run: node scripts/e2e-editor.cjs e2e-screenshots/editor
      - run: node scripts/smoke.cjs chromium e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  smoke:
    name: Engine smoke (${{ matrix.engine }} on ${{ matrix.os }})
    # The Mac app draws with WebKit and the Windows app with WebView2 (Edge): bugs that only one
    # engine has (PR 220: SVG filters froze WebKit) go red here instead of on a site's computer.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            engine: webkit
          - os: windows-latest
            engine: msedge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Edge is already on Windows runners; WebKit comes with Playwright.
      - if: matrix.engine == 'webkit'
        run: pnpm exec playwright install webkit
      - run: pnpm build
      - run: cargo build -p mrs-cli
      - run: node scripts/smoke.cjs ${{ matrix.engine }} smoke-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.engine }}
          path: smoke-screenshots
          if-no-files-found: ignore
