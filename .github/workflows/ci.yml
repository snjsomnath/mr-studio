name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Engine, site, host and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan driver, so the GPU kernels and the GPU/CPU parity tests run without a GPU.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo test

  web:
    name: SDK, runtime and layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @mrstudio/sdk test
      # The density budget: every panel and theme in the repo is checked against the dashboard rules.
      - run: pnpm --filter @mrstudio/dashboard test
      - run: pnpm build
