name: Desktop app

# Builds the installers for Windows and macOS.
# - Every pull request: the installers are attached to the run as artifacts.
# - Every push to main: the checks run first (ci.yml, #505). Only when they pass do the release
#   notes waiting in changes/ become a new version (scripts/release.mjs: Cargo.toml,
#   CHANGELOG.md, a vX.Y.Z tag), which is then built and published as a GitHub release that
#   installed apps show on Home. When they fail nothing is released: the notes wait in changes/
#   and go out with the next merge whose checks pass. See docs/RELEASING.md.
# - A tag like v0.2.0 pushed by hand: checked, built and published the same way.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Releases run one after another and are never cancelled half way; pull request builds are.
concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same checks a pull request gets, on the commit that would be released. Pull requests
  # run them through ci.yml itself.
  checks:
    name: Checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  version:
    name: New version from the release notes
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Only the commit whose checks just passed is released (#505). When main has moved on
      # since, this run makes no version: the run for the newer commit checks everything
      # merged so far and releases it, so two quick merges never release the same note twice
      # and nothing unchecked goes out.
      - id: release
        run: |
          git config user.name "mr-studio-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3 4; do
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "main has moved on from $GITHUB_SHA; the run for the newer commit makes the version."
              exit 0
            fi
            git reset --hard origin/main
            version=$(node scripts/release.mjs apply)
            if [ -z "$version" ]; then
              if [ -n "$(git status --porcelain)" ]; then
                git commit -am "Clear release notes that make no version [skip ci]" && git push origin HEAD:main || { sleep $((try * 5)); continue; }
              fi
              echo "No release notes waiting, so no new version."
              exit 0
            fi
            git add -A
            git commit -m "Release v$version [skip ci]"
            git tag "v$version"
            if git push --atomic origin HEAD:main "v$version"; then
              echo "tag=v$version" >> "$GITHUB_OUTPUT"
              echo "Released v$version"
              exit 0
            fi
            git tag -d "v$version"
            sleep $((try * 5))
          done
          echo "::error::Could not push the release after 4 tries."
          exit 1

  build:
    name: ${{ matrix.name }}
    needs: [checks, version]
    # Runs for pull requests and tags too, where the version job is skipped. Never after failed checks.
    if: ${{ !cancelled() && needs.checks.result != 'failure' && needs.version.result != 'failure' && (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.version.outputs.tag != '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            args: --bundles nsis
            program: target/release/mr-studio.exe
            artifact: mr-studio-windows
            bundle: target/release/bundle
          - name: macOS app (Apple silicon and Intel)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            program: target/universal-apple-darwin/release/bundle/macos/MR Studio.app/Contents/MacOS/mr-studio
            cli_target: universal-apple-darwin
            artifact: mr-studio-macos
            bundle: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Display matching, displays.json, site discovery, colour settings and the update check.
      - run: cargo test -p mr-studio-app
      # Builds the surfaces, stages them with the layers and the sample site, and makes the installer.
      # With the updater key (docs/RELEASING.md) a tag build also makes the signed update files.
      - name: Build the installer
        shell: bash
        env:
          MRS_UPDATER_PUBKEY: ${{ vars.MRS_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.version.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          version=$(node scripts/app-version.mjs)
          args="${{ matrix.args }}"
          # The build stamp the app shows on Home and on the Updates tab.
          export MRS_BUILD_COMMIT=$(git rev-parse HEAD)
          export MRS_BUILD_DATE=$(git show -s --format=%cI HEAD)
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ "$RELEASE_TAG" != "v$version" ]]; then
              echo "::error::The tag is $RELEASE_TAG but Cargo.toml says version $version. Set the version first, then tag."
              exit 1
            fi
            if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$MRS_UPDATER_PUBKEY" ]]; then
              node scripts/release-config.mjs
              args="$args --config src-tauri/tauri.release.conf.json"
            else
              echo "::warning::No updater key is set, so this release cannot be installed from inside the app. See docs/RELEASING.md."
            fi
          fi
          # The mrstudio command line goes inside the app, beside its program (#320).
          node scripts/stage-cli.mjs ${{ matrix.cli_target }}
          args="$args --config src-tauri/tauri.cli.conf.json"
          # Making the dmg sometimes fails on the runner with "hdiutil: Resource busy". A second
          # try only repeats the packaging, because the compiled app is already there.
          pnpm app:build $args || { echo "::warning::The build failed once; trying again in 30 seconds."; sleep 30; pnpm app:build $args; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The program that was just built is started on the sample table (#514): the host answers
      # and a window draws, or nothing is published.
      - name: The app starts
        shell: bash
        run: node scripts/launch-check.mjs "${{ matrix.program }}"
      # Release files get names without spaces, so their download links are predictable.
      - name: Collect the files
        shell: bash
        run: |
          mkdir release
          bundle="${{ matrix.bundle }}"
          copy() { for file in $1; do [ -e "$file" ] && cp "$file" "release/$2"; done; true; }
          copy "$bundle/nsis/*-setup.exe" "MR-Studio_${VERSION}_windows-x64-setup.exe"
          copy "$bundle/nsis/*-setup.exe.sig" "MR-Studio_${VERSION}_windows-x64-setup.exe.sig"
          copy "$bundle/dmg/*.dmg" "MR-Studio_${VERSION}_macos-universal.dmg"
          copy "$bundle/macos/*.app.tar.gz" "MR-Studio_${VERSION}_macos-universal.app.tar.gz"
          copy "$bundle/macos/*.app.tar.gz.sig" "MR-Studio_${VERSION}_macos-universal.app.tar.gz.sig"
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [checks, version, build]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success' && (needs.version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      # latest.json is what an installed app reads to update itself: the version, and for
      # each platform the download link and the signature of the file behind it.
      - name: Write latest.json
        run: node scripts/update-feed.mjs release "${{ github.repository }}" "$TAG"
      # The MCP server of the same version (docs/MCP.md): one file for any AI app, and the
      # Claude Desktop extension, which installs with a double-click.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Build the MCP server
        run: |
          pnpm install --frozen-lockfile && pnpm --filter @mrstudio/mcp bundle
          cp packages/mcp/dist/mrstudio-mcp.mjs packages/mcp/dist/mr-studio.mcpb release/
      # The notes come from CHANGELOG.md, with the pictures of the pull requests that made them.
      - name: Write the notes
        run: node scripts/release.mjs notes "$TAG" "${{ github.repository }}" > release-notes.md && cat release-notes.md
      # Published straight away: the app on Home and on the Updates tab shows it from now on.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: MR Studio ${{ env.TAG }}
          body_path: release-notes.md
          make_latest: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.app.tar.gz
            release/latest.json
            release/mrstudio-mcp.mjs
            release/mr-studio.mcpb

  # Says in the run's summary why nothing was released, so a held or half-made version is noticed.
  held:
    name: Why nothing was released
    needs: [checks, version, build, release]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.checks.result == 'failure' || needs.version.result == 'failure' || needs.build.result == 'failure' || needs.release.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          VERSION: ${{ needs.version.result }}
          BUILD: ${{ needs.build.result }}
          RELEASE: ${{ needs.release.result }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ "$CHECKS" = failure ]; then
            message="The checks failed on this commit, so no version was made. The release notes stay in changes/ and go out with the next merge whose checks pass."
          elif [ -n "$TAG" ]; then
            message="$TAG was tagged but not published (version: $VERSION, build: $BUILD, release: $RELEASE). Run the failed jobs again; installed apps are not offered $TAG until the release exists."
          else
            message="Nothing was published (version: $VERSION, build: $BUILD, release: $RELEASE)."
          fi
          echo "::error::$message"
          echo "### Nothing was released" >> "$GITHUB_STEP_SUMMARY"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  # Stages the same MCP server on npm and lists it in the MCP Registry once approved
  # (.github/workflows/mcp-publish.yml). Off until the repository variable MCP_PUBLISH is "true".
  publish-mcp:
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && vars.MCP_PUBLISH == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-publish.yml
    with:
      tag: ${{ needs.version.outputs.tag || github.ref_name }}
    secrets: inherit
