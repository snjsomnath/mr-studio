name: Desktop app

# Builds the installers for Windows and macOS.
# - Every pull request and every push to main: the installers are attached to the run as artifacts.
# - A tag like v0.2.0: they are also attached to a draft GitHub release for that tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            args: --bundles nsis
            artifact: mr-studio-windows
            files: target/release/bundle/nsis/*.exe
          - name: macOS app (Apple silicon and Intel)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: mr-studio-macos
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      # The kernels and their GPU/CPU parity tests on this platform's own graphics API
      # (DirectX 12 or Metal). They skip themselves where the runner has no adapter.
      - run: cargo test -p mrs-engine -- --nocapture
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Display matching, displays.json and site discovery.
      - run: cargo test -p mr-studio-app
      # Builds the surfaces, stages them with the layers and the sample site, and makes the installer.
      - run: pnpm app:build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}
