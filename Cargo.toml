[workspace]
resolver = "2"
members = ["crates/mrs-engine", "crates/mrs-site", "crates/mrs-host", "crates/mrs-cli", "apps/studio/src-tauri"]
# The desktop shell needs system webview libraries; build it on purpose with `-p mr-studio-app`.
default-members = ["crates/mrs-engine", "crates/mrs-site", "crates/mrs-host", "crates/mrs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace.lints.clippy]
# `!(x > 0.0)` is deliberate: it also rejects NaN.
neg_cmp_op_on_partial_ord = "allow"

[workspace.dependencies]
mrs-engine = { path = "crates/mrs-engine" }
mrs-site = { path = "crates/mrs-site" }
mrs-host = { path = "crates/mrs-host" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the key order of site.json when the host rewrites its layer list.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev.package."*"]
opt-level = 2

# The CPU reference kernels are far too slow unoptimised, in tests and in `pnpm dev`.
[profile.dev.package.mrs-engine]
opt-level = 3

[profile.release]
lto = "thin"
