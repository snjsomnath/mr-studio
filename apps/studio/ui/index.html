<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>MR Studio</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <header>
      <h1>MR Studio</h1>
      <span id="version"></span>
      <span id="running" hidden></span>
    </header>

    <p id="error" role="alert" hidden></p>

    <main>
      <section aria-labelledby="sites-title">
        <div class="section-head">
          <h2 id="sites-title">Site</h2>
          <button id="add-site" type="button" class="quiet">Add a site folder…</button>
        </div>
        <ul id="sites" class="sites"></ul>
        <p id="sites-hint" class="hint"></p>
      </section>

      <section aria-labelledby="displays-title">
        <div class="section-head">
          <h2 id="displays-title">Displays</h2>
          <button id="identify" type="button" class="quiet">Show numbers on screens</button>
        </div>
        <div id="map" class="map" aria-hidden="true"></div>
        <ul id="displays" class="displays"></ul>
        <label class="check"><input id="fullscreen" type="checkbox" /> Fullscreen <span class="hint">Turn off to try things in normal windows.</span></label>
      </section>
    </main>

    <footer>
      <div class="options">
        <label class="check"><input id="autostart" type="checkbox" /> Start like this every time the app opens</label>
        <label class="check"><input id="lan" type="checkbox" /> Let phones on this network join <span class="hint">Windows may ask once to allow network access.</span></label>
      </div>
      <div class="actions">
        <span class="hint keys">In a running session: <kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>S</kbd> opens this window, <kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>Q</kbd> quits.</span>
        <button id="quit" type="button">Quit</button>
        <button id="start" type="button" class="primary">Start</button>
      </div>
    </footer>

    <script src="launcher.js"></script>
  </body>
</html>
