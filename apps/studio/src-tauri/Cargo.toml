[package]
name = "mr-studio-app"
description = "MR Studio desktop shell: embeds the host and places one window per display"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "mr-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mrs-engine.workspace = true
mrs-host.workspace = true
mrs-site.workspace = true
anyhow.workspace = true
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
trash = "5"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Mapi", "Win32_UI_Input_KeyboardAndMouse"] }

# Share by email (#372): the Compose Email share service.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSharingService"] }

[lints]
workspace = true
