[package]
name = "mr-studio-app"
description = "MR Studio desktop shell: embeds the host and places one window per display"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "mr-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mrs-engine.workspace = true
mrs-host.workspace = true
mrs-site.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
trash = "5"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation"] }

[lints]
workspace = true
